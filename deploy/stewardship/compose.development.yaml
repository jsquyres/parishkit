x-live-source: &live-source
  type: bind
  source: ../../src
  target: /app/src
  read_only: true
  bind:
    create_host_path: false

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/stewardship/Dockerfile
    command: [service, --profile, development, --service-role, web]
    volumes: [*live-source]
    ports: ["127.0.0.1:${STEWARDSHIP_HTTP_PORT:-8000}:8000"]
    networks: [backend, development]

  tests:
    extends:
      file: compose.yaml
      service: web
    profiles: [test]
    entrypoint: [python, -m, pytest]
    command: [-p, no:cacheprovider]
    healthcheck:
      disable: true
    volumes:
      - *live-source
      - ../../tests:/app/tests:ro
      - ../../scripts/pk-stewardship/pk-stewardship.py:/app/scripts/pk-stewardship/pk-stewardship.py:ro
      - ../../scripts/pk-stewardship/README.md:/app/scripts/pk-stewardship/README.md:ro
      - ../../scripts/pk-stewardship/example-config.yaml:/app/scripts/pk-stewardship/example-config.yaml:ro
      - ../../scripts/pk-cron-runner/pk-cron-runner.py:/app/scripts/pk-cron-runner/pk-cron-runner.py:ro
      - ../../scripts/pk-cron-runner/README.md:/app/scripts/pk-cron-runner/README.md:ro
      - ../../scripts/pk-cron-runner/example-config.yaml:/app/scripts/pk-cron-runner/example-config.yaml:ro
      - ../../scripts/pk-query-ps-memfam/pk-query-ps-memfam.py:/app/scripts/pk-query-ps-memfam/pk-query-ps-memfam.py:ro
      - ../../scripts/pk-query-ps-memfam/README.md:/app/scripts/pk-query-ps-memfam/README.md:ro
      - ../../scripts/pk-query-ps-memfam/example-config.yaml:/app/scripts/pk-query-ps-memfam/example-config.yaml:ro
      - ../../scripts/pk-print-ps-ministries/pk-print-ps-ministries.py:/app/scripts/pk-print-ps-ministries/pk-print-ps-ministries.py:ro
      - ../../scripts/pk-print-ps-ministries/README.md:/app/scripts/pk-print-ps-ministries/README.md:ro
      - ../../scripts/pk-print-ps-ministries/example-config.yaml:/app/scripts/pk-print-ps-ministries/example-config.yaml:ro
      - ../../scripts/pk-validate-gcalendar-reservations/pk-validate-gcalendar-reservations.py:/app/scripts/pk-validate-gcalendar-reservations/pk-validate-gcalendar-reservations.py:ro
      - ../../scripts/pk-validate-gcalendar-reservations/README.md:/app/scripts/pk-validate-gcalendar-reservations/README.md:ro
      - ../../scripts/pk-validate-gcalendar-reservations/example-config.yaml:/app/scripts/pk-validate-gcalendar-reservations/example-config.yaml:ro
      - ../../scripts/pk-create-ps-ministry-rosters/pk-create-ps-ministry-rosters.py:/app/scripts/pk-create-ps-ministry-rosters/pk-create-ps-ministry-rosters.py:ro
      - ../../scripts/pk-create-ps-ministry-rosters/README.md:/app/scripts/pk-create-ps-ministry-rosters/README.md:ro
      - ../../scripts/pk-create-ps-ministry-rosters/example-config.yaml:/app/scripts/pk-create-ps-ministry-rosters/example-config.yaml:ro
      - ../../scripts/pk-sync-ps-to-ggroup/pk-sync-ps-to-ggroup.py:/app/scripts/pk-sync-ps-to-ggroup/pk-sync-ps-to-ggroup.py:ro
      - ../../scripts/pk-sync-ps-to-ggroup/README.md:/app/scripts/pk-sync-ps-to-ggroup/README.md:ro
      - ../../scripts/pk-sync-ps-to-ggroup/example-config.yaml:/app/scripts/pk-sync-ps-to-ggroup/example-config.yaml:ro
      - ../../scripts/pk-sync-ps-to-cc/pk-sync-ps-to-cc.py:/app/scripts/pk-sync-ps-to-cc/pk-sync-ps-to-cc.py:ro
      - ../../scripts/pk-sync-ps-to-cc/README.md:/app/scripts/pk-sync-ps-to-cc/README.md:ro
      - ../../scripts/pk-sync-ps-to-cc/example-config.yaml:/app/scripts/pk-sync-ps-to-cc/example-config.yaml:ro
      - ../../tools/prepare-release.py:/app/tools/prepare-release.py:ro
      - ../../install.py:/app/install.py:ro
      - ../../coverage-stewardship.toml:/app/coverage-stewardship.toml:ro
      - ../../docs/specs/stewardship:/app/docs/specs/stewardship:ro
      - ../../docs/plans/stewardship:/app/docs/plans/stewardship:ro
      - ../../docs/development/stewardship-acceptance.yaml:/app/docs/development/stewardship-acceptance.yaml:ro
      - ../../docs/development/stewardship.md:/app/docs/development/stewardship.md:ro
      - ../../.github/workflows/ci.yml:/app/.github/workflows/ci.yml:ro
      - ../../.github/workflows/release.yml:/app/.github/workflows/release.yml:ro
      - ../../deploy/stewardship:/app/deploy/stewardship:ro
